<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delegent-architecture-title delegent-architecture-desc" id="delegent-architecture-root">
        <title id="delegent-architecture-title">How delegent works</title>
        <desc id="delegent-architecture-desc">An agent sends a tool call to the delegent gateway. The gateway checks its policy, asks a human when the call is not approved yet, adds the real credential and forwards the call to an MCP server or to another agent. Every decision is written to a signed receipt log.</desc>
